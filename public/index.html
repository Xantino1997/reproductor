<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#11121a" />
  <title>Media Player</title>

  <!-- Favicon -->
  <link rel="icon" href="./Img/Empathia.png" type="image/png" />

  <!-- Meta tag para preview de links -->
  <meta property="og:image" content="./Img/Empathia.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="128" />
  <meta property="og:image:height" content="128" />

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="player-container">
    <div class="visor" id="">
      <div>Reproductor detenido</div>
    </div>
    <div class="scrolling-message" id="scrollingMessage">
      <span>Este es el nombre del elemento actual en la playlist.</span>
    </div>
  </div>

  <div class="reproductor-buttons">
    <!-- Reproductores de video, imagen y audio en la pantalla principal -->
    <div class="media-display">
      <video id="videoPlayer" controls playsinline hidden></video>
      <img id="imageDisplay" src="./Img/Empathia.png" alt="Empathia" />
      <audio id="audioPlayer" controls hidden></audio>
    </div>

    <div class="playlist-section">
      <div class="second-screen-section">
        <button id="activateSecondScreenBtn" aria-pressed="false">
          Activar segunda pantalla
        </button>
        <button id="voiceCmdBtn" aria-pressed="false">
          🎤 Activar comandos de voz
        </button>
        <h3>Playlist</h3>
      </div>
      <ul id="playlist" class="draggable-list"></ul>
    </div>
  </div>

  <div class="upload-section">
    <div class="drag-section">
      <h2>Subir contenido</h2>
      <button class="uploadBtn" id="uploadBtn">
        Subir Video / Imagen / Audio
      </button>
      <input
        type="file"
        id="fileInput"
        accept="video/*,image/*,audio/*"
        multiple
        hidden
      />
      <div class="drag-drop-area" id="dragDropArea" role="button" tabindex="0">
        <span class="dnd-desktop-text">Arrastrá y soltá archivos aquí</span>
        <span class="dnd-mobile-text">Tocá aquí para elegir archivos</span>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    function updateScrollingMessage(text) {
      const scrollingMessage = document.getElementById('scrollingMessage');
      scrollingMessage.querySelector('span').textContent = text;
    }
    const activeItemName = "Playlist";
    updateScrollingMessage(`Actualmente esperando: ${activeItemName}`);
  </script>
</body>
</html>
